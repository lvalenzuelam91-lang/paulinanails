<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Nail Studio - Citas e Inventario</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para interpretar JSX directamente en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FDF8F6] text-stone-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // ========================================================================
    // ICONOS SVG INTEGRADOS (Cero dependencias externas que puedan fallar)
    // ========================================================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        sparkles: <><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></>,
        calendar: <><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
        package: <><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></>,
        chevronRight: <polyline points="9 18 15 12 9 6"/>,
        chevronLeft: <polyline points="15 18 9 12 15 6"/>,
        chevronDown: <polyline points="6 9 12 15 18 9"/>,
        chevronUp: <polyline points="18 15 12 9 6 15"/>,
        arrowLeft: <><line x1="19" x2="5" y1="12" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
        home: <><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
        plus: <><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></>,
        clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
        checkCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
        xCircle: <><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></>,
        alert: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>,
        edit: <><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></>,
        trash: <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>,
        dollar: <><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
        layers: <><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>,
        arrowDownRight: <><line x1="7" x2="17" y1="7" y2="17"/><polyline points="17 7 17 17 7 17"/></>,
        arrowUpRight: <><line x1="7" x2="17" y1="17" y2="7"/><polyline points="7 7 17 7 17 17"/></>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></>,
        x: <><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></>,
        check: <polyline points="20 6 9 17 4 12"/>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || null}
        </svg>
      );
    };

    // ========================================================================
    // DATOS INICIALES Y UTILIDADES
    // ========================================================================
    const getFormattedDate = (offsetDays = 0) => {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    };

    const TODAY_STR = getFormattedDate(0);
    const TOMORROW_STR = getFormattedDate(1);
    const DAY_AFTER_STR = getFormattedDate(2);
    const YESTERDAY_STR = getFormattedDate(-1);

    const INITIAL_APPOINTMENTS = [
      { id: 'cit-101', date: TODAY_STR, time: '10:00', clientName: 'Valeria Mendoza', phone: '526871234567', service: 'Uñas Acrílicas Esculturales + Diseño', price: 550, status: 'Completada', notes: 'Tono nude con french blanco y pedrería sutil.' },
      { id: 'cit-102', date: TODAY_STR, time: '13:30', clientName: 'Camila Rodríguez', phone: '526879876543', service: 'Soft Gel + Efecto Aurora', price: 420, status: 'Pendiente', notes: 'Trae referencia de Pinterest, largo mediano almendra.' },
      { id: 'cit-103', date: TODAY_STR, time: '16:30', clientName: 'Sofía Castro', phone: '526875551234', service: 'Retoque Acrílico + Gelish', price: 350, status: 'Pendiente', notes: 'Revisar uña índice derecha.' },
      { id: 'cit-104', date: TOMORROW_STR, time: '11:00', clientName: 'Mariana López', phone: '526874448899', service: 'Manicura Rusa + Nivelación Rubber', price: 380, status: 'Pendiente', notes: 'Color vino tinto clásico.' }
    ];

    const INITIAL_INVENTORY = [
      { id: 'inv-1', sku: 'MON-001', name: 'Monómero Bajo Aroma 8 oz', category: 'Acrílico', stock: 4, minStock: 2, unitCost: 320.00 },
      { id: 'inv-2', sku: 'POL-002', name: 'Polímero Cristal Ultra Fine 4 oz', category: 'Acrílico', stock: 2, minStock: 3, unitCost: 240.00 },
      { id: 'inv-3', sku: 'GEL-015', name: 'Base Coat & Top Coat Ruber Duo', category: 'Geles', stock: 6, minStock: 2, unitCost: 185.00 },
      { id: 'inv-4', sku: 'LIM-100', name: 'Paquete Limas 100/180 Zebra (25 pzas)', category: 'Herramientas', stock: 1, minStock: 2, unitCost: 160.00 },
      { id: 'inv-5', sku: 'TIP-500', name: 'Caja Tips Soft Gel Almendra (500 pzas)', category: 'Tips y Formas', stock: 5, minStock: 2, unitCost: 210.00 }
    ];

    const INITIAL_MOVEMENTS = [
      { id: 'mov-1', date: YESTERDAY_STR, itemId: 'inv-1', itemName: 'Monómero Bajo Aroma 8 oz', sku: 'MON-001', type: 'ENTRADA', quantity: 3, unitCost: 320.00, totalCost: 960.00, notes: 'Compra a proveedor oficial' },
      { id: 'mov-2', date: TODAY_STR, itemId: 'inv-4', itemName: 'Paquete Limas 100/180 Zebra (25 pzas)', sku: 'LIM-100', type: 'SALIDA', quantity: 1, unitCost: 160.00, totalCost: 160.00, notes: 'Apertura de paquete para mesas' }
    ];

    const NAIL_SERVICES = ['Uñas Acrílicas Esculturales', 'Set Nuevo Acrílico con Tip', 'Retoque Acrílico + Gelish', 'Soft Gel + Diseño', 'Gelish en Uña Natural', 'Manicura Rusa + Nivelación Rubber', 'Retiro de Sistema + Manicura', 'Pedicure Spa + Gelish'];
    const INVENTORY_CATEGORIES = ['Acrílico', 'Geles', 'Tips y Formas', 'Herramientas', 'Líquidos', 'Decoración', 'Desechables'];
    const MONTHS_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const DAYS_SHORT_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

    // ========================================================================
    // COMPONENTE PRINCIPAL
    // ========================================================================
    function App() {
      const [activeScreen, setActiveScreen] = useState('home');

      const [appointments, setAppointments] = useState(() => {
        try { const s = localStorage.getItem('aura_nail_appointments'); return s ? JSON.parse(s) : INITIAL_APPOINTMENTS; } catch { return INITIAL_APPOINTMENTS; }
      });
      const [inventory, setInventory] = useState(() => {
        try { const s = localStorage.getItem('aura_nail_inventory'); return s ? JSON.parse(s) : INITIAL_INVENTORY; } catch { return INITIAL_INVENTORY; }
      });
      const [movements, setMovements] = useState(() => {
        try { const s = localStorage.getItem('aura_nail_movements'); return s ? JSON.parse(s) : INITIAL_MOVEMENTS; } catch { return INITIAL_MOVEMENTS; }
      });

      useEffect(() => { try { localStorage.setItem('aura_nail_appointments', JSON.stringify(appointments)); } catch {} }, [appointments]);
      useEffect(() => { try { localStorage.setItem('aura_nail_inventory', JSON.stringify(inventory)); } catch {} }, [inventory]);
      useEffect(() => { try { localStorage.setItem('aura_nail_movements', JSON.stringify(movements)); } catch {} }, [movements]);

      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // --- Estados de Citas ---
      const [selectedDate, setSelectedDate] = useState(TODAY_STR);
      const [currentMonthDate, setCurrentMonthDate] = useState(() => {
        const [y, m] = TODAY_STR.split('-').map(Number);
        return new Date(y, m - 1, 1);
      });
      const [expandedAppointmentId, setExpandedAppointmentId] = useState('cit-102');
      const [isDayAccordionOpen, setIsDayAccordionOpen] = useState(true);
      const [appointmentModalOpen, setAppointmentModalOpen] = useState(false);
      const [editingAppointment, setEditingAppointment] = useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [appointmentForm, setAppointmentForm] = useState({
        date: TODAY_STR, time: '12:00', clientName: '', phone: '', service: NAIL_SERVICES[0], price: 450, status: 'Pendiente', notes: ''
      });

      const calendarDays = useMemo(() => {
        const year = currentMonthDate.getFullYear();
        const month = currentMonthDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysArray = [];
        for (let i = 0; i < firstDayOfMonth; i++) daysArray.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          daysArray.push({ day: d, dateStr, appointments: appointments.filter(a => a.date === dateStr) });
        }
        return daysArray;
      }, [currentMonthDate, appointments]);

      const selectedDayAppointments = useMemo(() => {
        return appointments.filter(a => a.date === selectedDate).sort((a, b) => a.time.localeCompare(b.time));
      }, [appointments, selectedDate]);

      const formatReadableDate = (dateStr) => {
        if (!dateStr) return '';
        if (dateStr === TODAY_STR) return 'Hoy';
        if (dateStr === TOMORROW_STR) return 'Mañana';
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        const dayName = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'][dateObj.getDay()];
        return `${dayName} ${d} de ${MONTHS_ES[m - 1]}`;
      };

      const handleSaveAppointment = (e) => {
        e.preventDefault();
        if (!appointmentForm.clientName.trim()) return showToast('Ingresa el nombre de la clienta', 'error');
        if (editingAppointment) {
          setAppointments(prev => prev.map(item => item.id === editingAppointment.id ? { ...appointmentForm, id: item.id } : item));
          showToast('Cita actualizada');
        } else {
          const newApp = { ...appointmentForm, id: `cit-${Date.now()}`, price: Number(appointmentForm.price) || 0 };
          setAppointments(prev => [...prev, newApp]);
          setSelectedDate(newApp.date);
          setExpandedAppointmentId(newApp.id);
          showToast('Cita agendada con éxito');
        }
        setAppointmentModalOpen(false);
      };

      // --- Estados de Inventario ---
      const [inventorySearch, setInventorySearch] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('Todas');
      const [onlyLowStock, setOnlyLowStock] = useState(false);
      const [movementFilter, setMovementFilter] = useState('TODOS');
      const [newProductModalOpen, setNewProductModalOpen] = useState(false);
      const [movementModalOpen, setMovementModalOpen] = useState(false);

      const [newProductForm, setNewProductForm] = useState({ sku: '', name: '', category: INVENTORY_CATEGORIES[0], stock: 1, minStock: 2, unitCost: 150 });
      const [movementForm, setMovementForm] = useState({ itemId: INITIAL_INVENTORY[0]?.id || '', type: 'ENTRADA', quantity: 1, unitCost: 0, date: TODAY_STR, notes: '' });

      const inventoryMetrics = useMemo(() => {
        const totalValue = inventory.reduce((acc, item) => acc + item.stock * item.unitCost, 0);
        const totalUnits = inventory.reduce((acc, item) => acc + item.stock, 0);
        const lowStockCount = inventory.filter(item => item.stock <= item.minStock).length;
        return { totalValue, totalItems: inventory.length, totalUnits, lowStockCount };
      }, [inventory]);

      const filteredInventory = useMemo(() => {
        return inventory.filter(item => {
          const matchesSearch = item.name.toLowerCase().includes(inventorySearch.toLowerCase()) || item.sku.toLowerCase().includes(inventorySearch.toLowerCase());
          const matchesCategory = categoryFilter === 'Todas' || item.category === categoryFilter;
          const matchesLowStock = !onlyLowStock || item.stock <= item.minStock;
          return matchesSearch && matchesCategory && matchesLowStock;
        });
      }, [inventory, inventorySearch, categoryFilter, onlyLowStock]);

      const filteredMovements = useMemo(() => {
        return movements.filter(m => movementFilter === 'TODOS' || m.type === movementFilter).sort((a, b) => b.date.localeCompare(a.date));
      }, [movements, movementFilter]);

      const openMovementModal = (type = 'ENTRADA', preselectedItem = null) => {
        const targetItem = preselectedItem || inventory[0];
        setMovementForm({ itemId: targetItem ? targetItem.id : '', type, quantity: 1, unitCost: targetItem ? targetItem.unitCost : 0, date: TODAY_STR, notes: '' });
        setMovementModalOpen(true);
      };

      const handleSaveMovement = (e) => {
        e.preventDefault();
        const targetItem = inventory.find(i => i.id === movementForm.itemId);
        if (!targetItem) return showToast('Selecciona un insumo válido', 'error');
        const qty = Number(movementForm.quantity);
        if (qty <= 0) return showToast('La cantidad debe ser mayor a 0', 'error');
        if (movementForm.type === 'SALIDA' && targetItem.stock < qty) return showToast(`Stock insuficiente (${targetItem.stock} disp.)`, 'error');

        const costPerUnit = Number(movementForm.unitCost) || targetItem.unitCost;
        setInventory(prev => prev.map(item => {
          if (item.id !== targetItem.id) return item;
          if (movementForm.type === 'ENTRADA') {
            const newStock = item.stock + qty;
            const updatedUnitCost = newStock > 0 ? ((item.stock * item.unitCost) + (qty * costPerUnit)) / newStock : costPerUnit;
            return { ...item, stock: newStock, unitCost: Number(updatedUnitCost.toFixed(2)) };
          }
          return { ...item, stock: item.stock - qty };
        }));

        setMovements(prev => [{
          id: `mov-${Date.now()}`, date: movementForm.date, itemId: targetItem.id, itemName: targetItem.name, sku: targetItem.sku,
          type: movementForm.type, quantity: qty, unitCost: costPerUnit, totalCost: Number((qty * costPerUnit).toFixed(2)),
          notes: movementForm.notes || (movementForm.type === 'ENTRADA' ? 'Compra de reposición' : 'Consumo de salón')
        }, ...prev]);

        setMovementModalOpen(false);
        showToast(`${movementForm.type === 'ENTRADA' ? 'Entrada' : 'Salida'} registrada correctamente`);
      };

      const handleAddNewProduct = (e) => {
        e.preventDefault();
        if (!newProductForm.name.trim() || !newProductForm.sku.trim()) return showToast('Completa SKU y nombre', 'error');
        const createdItem = {
          id: `inv-${Date.now()}`, sku: newProductForm.sku.toUpperCase(), name: newProductForm.name.trim(),
          category: newProductForm.category, stock: Number(newProductForm.stock) || 0,
          minStock: Number(newProductForm.minStock) || 1, unitCost: Number(newProductForm.unitCost) || 0
        };
        setInventory(prev => [createdItem, ...prev]);
        if (createdItem.stock > 0) {
          setMovements(prev => [{
            id: `mov-${Date.now() + 1}`, date: TODAY_STR, itemId: createdItem.id, itemName: createdItem.name, sku: createdItem.sku,
            type: 'ENTRADA', quantity: createdItem.stock, unitCost: createdItem.unitCost, totalCost: createdItem.stock * createdItem.unitCost, notes: 'Inventario inicial'
          }, ...prev]);
        }
        setNewProductForm({ sku: '', name: '', category: INVENTORY_CATEGORIES[0], stock: 1, minStock: 2, unitCost: 150 });
        setNewProductModalOpen(false);
        showToast('Insumo agregado al catálogo');
      };

      const handleExportCSV = () => {
        const headers = ['SKU,Insumo,Categoria,Stock Actual,Stock Minimo,Costo Unitario,Valor Total'];
        const rows = inventory.map(i => `"${i.sku}","${i.name}","${i.category}",${i.stock},${i.minStock},${i.unitCost.toFixed(2)},${(i.stock * i.unitCost).toFixed(2)}`);
        const link = document.createElement('a');
        link.href = encodeURI('data:text/csv;charset=utf-8,' + [headers, ...rows].join('\n'));
        link.download = `Inventario_NailStudio_${TODAY_STR}.csv`;
        link.click();
        showToast('Inventario descargado en CSV');
      };

      const todayAppointmentsCount = appointments.filter(a => a.date === TODAY_STR && a.status !== 'Cancelada').length;
      const todayEstimatedIncome = appointments.filter(a => a.date === TODAY_STR && a.status !== 'Cancelada').reduce((sum, a) => sum + Number(a.price || 0), 0);

      return (
        <div className="min-h-screen flex flex-col">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50">
              <div className={`flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl border text-sm font-medium ${toast.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-stone-900 border-stone-700 text-rose-50'}`}>
                <Icon name={toast.type === 'error' ? 'alert' : 'sparkles'} className="w-5 h-5 text-rose-300" />
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {activeScreen === 'home' ? (
            /* PANTALLA DE INICIO LIMPIA */
            <div className="flex-1 flex flex-col items-center justify-center px-4 py-12 relative overflow-hidden">
              <div className="text-center max-w-md mx-auto mb-10">
                <div className="w-20 h-20 rounded-3xl bg-gradient-to-br from-rose-300 via-rose-500 to-rose-800 flex items-center justify-center text-white shadow-xl mx-auto mb-5">
                  <Icon name="sparkles" className="w-10 h-10" />
                </div>
                <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-stone-900">
                  Aura <span className="font-light text-rose-700">Nail Studio</span>
                </h1>
                <p className="text-sm text-stone-500 mt-2">Selecciona el módulo al que deseas ingresar</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
                <button onClick={() => setActiveScreen('citas')} className="group text-left bg-white hover:bg-rose-50/60 rounded-3xl p-8 border border-rose-100 hover:border-rose-300 shadow-md hover:shadow-xl transition-all flex flex-col justify-between min-h-[230px]">
                  <div className="flex items-start justify-between w-full">
                    <div className="w-14 h-14 rounded-2xl bg-rose-100 group-hover:bg-rose-700 text-rose-700 group-hover:text-white flex items-center justify-center transition-colors">
                      <Icon name="calendar" className="w-7 h-7" />
                    </div>
                    <span className="px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-900">
                      {todayAppointmentsCount} {todayAppointmentsCount === 1 ? 'cita hoy' : 'citas hoy'}
                    </span>
                  </div>
                  <div className="mt-6">
                    <div className="flex items-center justify-between">
                      <h2 className="text-2xl font-bold text-stone-900">Citas</h2>
                      <Icon name="chevronRight" className="w-6 h-6 text-rose-400 group-hover:translate-x-1 transition-transform" />
                    </div>
                    <p className="text-sm text-stone-500 mt-2">Calendario de clientas y lista desplegable diaria con recordatorios por WhatsApp.</p>
                  </div>
                </button>

                <button onClick={() => { setOnlyLowStock(false); setActiveScreen('inventario'); }} className="group text-left bg-white hover:bg-rose-50/60 rounded-3xl p-8 border border-rose-100 hover:border-rose-300 shadow-md hover:shadow-xl transition-all flex flex-col justify-between min-h-[230px]">
                  <div className="flex items-start justify-between w-full">
                    <div className="w-14 h-14 rounded-2xl bg-stone-900 group-hover:bg-rose-700 text-rose-200 group-hover:text-white flex items-center justify-center transition-colors">
                      <Icon name="package" className="w-7 h-7" />
                    </div>
                    <div className="flex flex-col items-end gap-1">
                      <span className="px-3 py-1 rounded-full text-xs font-bold bg-stone-100 text-stone-800">{inventoryMetrics.totalItems} insumos</span>
                      {inventoryMetrics.lowStockCount > 0 && (
                        <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">{inventoryMetrics.lowStockCount} stock bajo</span>
                      )}
                    </div>
                  </div>
                  <div className="mt-6">
                    <div className="flex items-center justify-between">
                      <h2 className="text-2xl font-bold text-stone-900">Inventario</h2>
                      <Icon name="chevronRight" className="w-6 h-6 text-rose-400 group-hover:translate-x-1 transition-transform" />
                    </div>

                  <div className="grid grid-cols-2 gap-3">
                    <input type="number" min="1" required placeholder="Cantidad" value={movementForm.quantity} onChange={e => setMovementForm({ ...movementForm, quantity: e.target.value })} className="px-3 py-2.5 rounded-xl border border-stone-200" />
                    <input type="number" min="0" step="0.01" disabled={movementForm.type === 'SALIDA'} value={movementForm.unitCost} onChange={e => setMovementForm({ ...movementForm, unitCost: e.target.value })} className="px-3 py-2.5 rounded-xl border border-stone-200 disabled:bg-stone-100" />
                  </div>
                  <input type="date" required value={movementForm.date} onChange={e => setMovementForm({ ...movementForm, date: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-stone-200" />
                  <input type="text" placeholder="Motivo o nota..." value={movementForm.notes} onChange={e => setMovementForm({ ...movementForm, notes: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-stone-200" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setMovementModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100 font-semibold">Cancelar</button>
                    <button type="submit" className={`px-5 py-2 rounded-xl text-white font-bold ${movementForm.type === 'ENTRADA' ? 'bg-emerald-600' : 'bg-rose-700'}`}>Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL NUEVO INSUMO */}
          {newProductModalOpen && (
            <div className="fixed inset-0 z-50 bg-stone-900/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="px-6 py-4 bg-stone-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-sm">Nuevo Insumo</h3>
                  <button onClick={() => setNewProductModalOpen(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleAddNewProduct} className="p-6 space-y-3 text-xs">
                  <div className="grid grid-cols-3 gap-3">
                    <input type="text" required placeholder="SKU *" value={newProductForm.sku} onChange={e => setNewProductForm({ ...newProductForm, sku: e.target.value })} className="px-3 py-2.5 rounded-xl border border-stone-200 uppercase" />
                    <select value={newProductForm.category} onChange={e => setNewProductForm({ ...newProductForm, category: e.target.value })} className="col-span-2 px-3 py-2.5 rounded-xl border border-stone-200 bg-white">
                      {INVENTORY_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <input type="text" required placeholder="Nombre del insumo *" value={newProductForm.name} onChange={e => setNewProductForm({ ...newProductForm, name: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border border-stone-200" />
                  <div className="grid grid-cols-3 gap-3">
                    <div><label className="text-[10px] text-stone-500">Stock Inicial</label><input type="number" min="0" required value={newProductForm.stock} onChange={e => setNewProductForm({ ...newProductForm, stock: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-stone-200" /></div>
                    <div><label className="text-[10px] text-stone-500">Stock Mínimo</label><input type="number" min="0" required value={newProductForm.minStock} onChange={e => setNewProductForm({ ...newProductForm, minStock: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-stone-200" /></div>
                    <div><label className="text-[10px] text-stone-500">Costo Unit. ($)</label><input type="number" min="0" step="0.01" required value={newProductForm.unitCost} onChange={e => setNewProductForm({ ...newProductForm, unitCost: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-stone-200" /></div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setNewProductModalOpen(false)} className="px-4 py-2 rounded-xl bg-stone-100 font-semibold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-stone-900 text-white font-bold">Agregar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
